[package]
name = "mustty-web"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
description = "mustty in the browser: the platform-independent core driven through xterm.js"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mustty = { path = "../..", default-features = false }
ratatui = { version = "0.30.2", default-features = false }
# wasm-pack (web/package.json) downloads the wasm-bindgen CLI matching the version in Cargo.lock
wasm-bindgen = "0.2.130"
js-sys = "0.3.107"
web-sys = { version = "0.3.107", features = ["console"] }
# The App's clock type; on wasm it reads performance.now()
web-time = "1.1.0"

# Not a release artifact: cargo-dist skips it
[package.metadata.dist]
dist = false

# web/scripts/build-wasm.mjs builds through wasm-pack, which runs wasm-opt on release builds
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
