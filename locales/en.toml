settings-unit-spaces = "spaces"
settings-width = "Body width"
settings-vim = "Vim keys"
settings-mouse = "Mouse"
settings-autosave = "Autosave"
settings-autosave-idle = "Autosave delay"
settings-typewriter = "Typewriter mode"
settings-focus-mode = "Focus mode"
settings-scrolloff = "Scroll margin"
settings-tab-width = "Tab width"
settings-code-color = "Code color"
