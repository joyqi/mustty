# mustty UI strings. Source language and fallback for every other locale.
# Translate the right-hand side only; keep every {placeholder} unchanged.

# status bar
status-words-one = "{n} word"
status-words-other = "{n} words"
status-untitled = "Untitled"
status-title = "Title"
status-window-too-small = "Window too small"
status-hint = "^S save  ^P settings  ^Q quit"

# save prompt
prompt-save-as = "Save as: "
prompt-overwrite = "File exists, Enter to overwrite: "

# messages
msg-save-failed = "Save failed: {error}"
msg-typewriter = "Typewriter mode: {state}"
msg-focus = "Focus mode: {state}"
msg-on = "on"
msg-off = "off"
msg-quit-unsaved = "Unsaved changes, press Ctrl+Q again to discard"
msg-osc52-unsupported = "This terminal doesn't support OSC 52: copied to the internal register, Ctrl+V pastes"
msg-large-file = "File is over 5 MB: word count updates on save"

# file errors
io-not-utf8 = "Not a UTF-8 file (byte {offset})"
io-is-directory = "mustty only edits files"
io-externally-modified = "File changed on disk, Ctrl+S to overwrite"
io-stat-after-save = "Could not read file info after saving"

# config warnings
config-syntax-error = "~/.mustty.toml line {line}: syntax error, using defaults"
config-expected-integer = "{key} should be an integer, using default"
config-expected-bool = "{key} should be true or false, using default"
