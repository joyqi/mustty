# Called by release.yml (a dist custom publish job) after the GitHub Release
# exists. Renders Formula/mustty.rb from the release's .sha256 files and pushes
# it to joyqi/homebrew-tap.
#
# Requires the repository secret HOMEBREW_TAP_TOKEN: a fine-grained personal
# access token (github.com/settings/personal-access-tokens/new) with
# "Repository access: Only select repositories → joyqi/homebrew-tap" and
# "Repository permissions → Contents: Read and write". Add it under
# joyqi/mustty → Settings → Secrets and variables → Actions → New repository
# secret, named HOMEBREW_TAP_TOKEN. Never commit the token.
name: Publish Homebrew formula

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  formula:
    # Prereleases do not replace the formula
    if: ${{ !fromJson(inputs.plan).announcement_is_prerelease }}
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ fromJson(inputs.plan).announcement_tag }}
    steps:
      - name: Check for HOMEBREW_TAP_TOKEN
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error title=Missing secret::HOMEBREW_TAP_TOKEN is not set; see the comment at the top of .github/workflows/publish-homebrew.yml"
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          path: mustty
      - uses: actions/checkout@v6
        with:
          repository: joyqi/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Download checksums from the release
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.tar.gz.sha256' --dir sums
      - name: Render formula
        run: |
          mkdir -p tap/Formula
          mustty/.github/scripts/homebrew-formula.sh "$TAG" sums > tap/Formula/mustty.rb
          cat tap/Formula/mustty.rb
      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/mustty.rb
          if git diff --cached --quiet; then
            echo "Formula/mustty.rb is already up to date"
            exit 0
          fi
          git commit -m "mustty ${TAG#v}"
          git push
