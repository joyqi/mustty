# Builds the website in web/ (the landing page with mustty running in it as wasm) and uploads it to
# Cloudflare Pages, so the Pages build image needs no Rust: the runner has it.
#
# Runs when a release is out, and by hand (Actions → Pages → Run workflow, for the branch picked).
# Release.yml creates its releases with GITHUB_TOKEN, and events from GITHUB_TOKEN start no other
# workflows, so its `release: published` never reaches this file: a finished, successful Release run
# (a vX.Y.Z tag push) is what triggers it, building that tag's commit. `release: published` stays
# for releases published by hand.
#
# One-time setup:
# - A Cloudflare Pages project named `mustty` with production branch `main`, created as a Direct
#   Upload project (Workers & Pages → Create → Pages → Upload assets) or with
#   `npx wrangler pages project create mustty --production-branch=main`.
# - Repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN: Cloudflare dashboard → My Profile → API Tokens → Create Token, with the
#     permission Account · Cloudflare Pages · Edit (a custom token if no Pages template is offered)
#   CLOUDFLARE_ACCOUNT_ID: shown on the dashboard's Workers & Pages overview, and in its URLs

name: Pages

on:
  release:
    types: [published]
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  deploy:
    name: Build and deploy
    # From Release, only a successful run for a tag push (it also runs a plan on pull requests)
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add wasm32-unknown-unknown
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      # The wasm build compiles mustty and its dependencies for wasm32 every time
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: pnpm dlx wrangler@4.156.1 pages deploy dist --project-name=mustty --branch=main
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
