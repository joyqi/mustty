[package]
name = "mustty"
version = "0.1.2"
edition = "2024"
rust-version = "1.88"
description = "A distraction-free Markdown writer for the terminal"
license = "MIT"
repository = "https://github.com/joyqi/mustty"
homepage = "https://github.com/joyqi/mustty"
readme = "README.md"
keywords = ["markdown", "tui", "editor", "writing", "terminal"]
categories = ["command-line-utilities", "text-editors"]

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29.0"
# Only \n is a line break: a lone \r stays an ordinary character
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
unicode-segmentation = "1.13.3"
# Must resolve to the same version as ratatui-core
unicode-width = "=0.2.2"
unicode-linebreak = "0.1.5"
anyhow = "1.0.104"
tempfile = "3.27.0"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
dirs = "7.0.0"
# System locale (works on Windows even without LANG); env vars take precedence, see src/i18n.rs
sys-locale = "0.3.2"
# The settings panel writes back to ~/.mustty.toml: keeps comments and key order, touches only changed keys
toml_edit = "0.25.17"

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"

# tests/window_title.rs: runs the real binary in a pty
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.191"

[[example]]
name = "screenshot"
# cargo test runs its tests too, so a layout change can't silently turn the screenshot blank
test = true

# Release builds (cargo-dist, see dist-workspace.toml)
[profile.dist]
inherits = "release"
lto = "thin"
