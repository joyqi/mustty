[package]
name = "mustty"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A distraction-free Markdown writer for the terminal"
license = "MIT"
repository = "https://github.com/joyqi/mustty"
homepage = "https://github.com/joyqi/mustty"
readme = "README.md"
keywords = ["markdown", "tui", "editor", "writing", "terminal"]
categories = ["command-line-utilities", "text-editors"]

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29.0"
# 只把 \n 当作换行：孤立的 \r 作为普通字符保留
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
unicode-segmentation = "1.13.3"
# 必须与 ratatui-core 解析到同一版本
unicode-width = "=0.2.2"
unicode-linebreak = "0.1.5"
anyhow = "1.0.104"
tempfile = "3.27.0"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
dirs = "7.0.0"
# 系统语言（Windows 上不设 LANG 也能取到）；环境变量优先，见 src/i18n.rs
sys-locale = "0.3.2"
# 设置面板写回 ~/.mustty.toml：保留注释与键顺序，只改变化的键
toml_edit = "0.25.17"

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"

# tests/window_title.rs：在 pty 里跑真实二进制
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.191"

[[example]]
name = "screenshot"
# cargo test 也跑它的测试：防止布局改动后截图悄悄变空白
test = true

# 发布构建（cargo-dist，见 dist-workspace.toml）
[profile.dist]
inherits = "release"
lto = "thin"
