[workspace]
members = ["cargo:."]

# Release pipeline (cargo-dist). Pushing a tag vX.Y.Z that equals the version
# in Cargo.toml builds every target below, creates a GitHub Release with the
# archives, SHA256 files and the mustty-installer.sh / .ps1 scripts, then
# updates Formula/mustty.rb in joyqi/homebrew-tap (installed as
# `brew install joyqi/tap/mustty`).
#
# release.yml is generated by `dist generate` and then edited by hand in three
# places marked "mustty:" (header, tag pattern, version check), hence
# allow-dirty. Re-apply those edits after regenerating.
#
# The Homebrew formula is rendered by publish-homebrew.yml instead of dist's
# own installer, so that it uses on_macos/on_linux and on_arm/on_intel blocks.

[dist]
cargo-dist-version = "0.33.1"
ci = "github"
allow-dirty = ["ci"]
pr-run-mode = "skip"
publish-jobs = ["./publish-homebrew"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
unix-archive = ".tar.gz"
windows-archive = ".zip"
checksum = "sha256"
installers = ["shell", "powershell"]
