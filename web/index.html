<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mustty</title>
  <style>
    /* Must match the terminal backgrounds in src/theme.js so the terminal blends into the page */
    :root { color-scheme: dark; --bg: #0d1117; --fg: #e6edf3; --hover: #21262d; }
    :root[data-theme="light"] { color-scheme: light; --bg: #ffffff; --fg: #1f2328; --hover: #f3f4f6; }
    html, body { height: 100%; margin: 0; background: var(--bg); }
    #terminal { position: fixed; inset: 48px 16px 16px; }
    #theme-toggle {
      position: fixed; top: 8px; right: 16px; width: 32px; height: 32px; padding: 6px;
      border: 0; border-radius: 6px; background: transparent; color: var(--fg); cursor: pointer;
    }
    #theme-toggle:hover { background: var(--hover); }
    #theme-toggle svg { width: 20px; height: 20px; display: block; }
    /* Show the theme a click switches to */
    :root[data-theme="dark"] #theme-toggle .moon, :root[data-theme="light"] #theme-toggle .sun { display: none; }
  </style>
</head>
<body>
  <button id="theme-toggle" type="button" aria-label="Toggle light/dark theme" title="Toggle light/dark theme">
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
  </button>
  <div id="terminal"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
